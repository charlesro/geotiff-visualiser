# Build the Pixel Grid Designer — only that page — and publish it to GitHub Pages.
# The PCA app and its data files are deliberately not published.
#
# The site is served from https://<user>.github.io/<repo>/ — a sub-path — so the
# build is given --base=/<repo>/ for Vite's bundled assets. Runtime fetches and
# cross-page links are document-relative in the source, so they need nothing
# here. The regression suites gate the deploy: a red suite publishes nothing.
#
# One-time setup in the repo: Settings -> Pages -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Types first: vite/esbuild strip them without checking, so a type error
      # would otherwise publish happily.
      - run: npm run lint
      - run: npm test
      # PIXEL_GRID_ONLY builds that one entry and leaves out public/ (the PCA
      # app's data); VITE_STANDALONE drops the page's links back to the PCA app.
      - run: npx vite build --base=/${{ github.event.repository.name }}/
        env:
          PIXEL_GRID_ONLY: '1'
          VITE_STANDALONE: '1'
      # Serve it at the site root; pixel-grid.html stays too, for any existing link.
      - run: cp dist/pixel-grid.html dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
