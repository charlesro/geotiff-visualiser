# Build both pages (index.html + pixel-grid.html) and publish them to GitHub Pages.
#
# The site is served from https://<user>.github.io/<repo>/ — a sub-path — so the
# build is given --base=/<repo>/ for Vite's bundled assets. Runtime fetches and
# cross-page links are document-relative in the source, so they need nothing
# here. The regression suites gate the deploy: a red suite publishes nothing.
#
# One-time setup in the repo: Settings -> Pages -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx vite build --base=/${{ github.event.repository.name }}/
        env:
          VITE_PCA_HREF: ./pca.html
      # Land on the pixel grid designer — the page that works for every visitor
      # (the PCA app's database mode needs the local DuckDB engine). The PCA app
      # moves to pca.html; the pixel grid's back-links were built to point there.
      - run: mv dist/index.html dist/pca.html && cp dist/pixel-grid.html dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
